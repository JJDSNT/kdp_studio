[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kdp-studio"
version = "0.1.0"
description = "Open, filesystem-first production environment for books, from idea to KDP"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jaime Dias" }]
# Reading a book, checking it and deciding its gates needs only these.
# markdown-it-py is the parser behind the book format (docs/book-format.md);
# Jinja2 fills the edition templates.
dependencies = [
    "pyyaml>=6",
    "markdown-it-py>=3",
    "mdit-py-plugins>=0.4",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Building and measuring editions: QR codes for the prompts, and reading the
# PDF that LuaLaTeX writes. LuaLaTeX and Ghostscript are system tools;
# `kdp doctor` says how to install them.
build = ["qrcode>=8", "pillow>=10", "pypdf>=5"]
# The control room: `kdp serve <book>`, local only.
studio = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
# The assistant (ADR 0002): a LangGraph agent served over AG-UI to CopilotKit.
# The model is reached through an adapter -- by default the Claude Code CLI,
# with the author's own login -- so nothing here needs a key.
agents = ["langgraph>=1.2", "langgraph-checkpoint-sqlite>=2.0", "ag-ui-langgraph>=0.0.45", "anthropic>=0.70"]

[project.scripts]
kdp = "kdp_studio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kdp_studio"]

[dependency-groups]
dev = ["pytest>=8", "flake8>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]
